# CI for meru-core: the gate that runs on every push and pull request.
#
# The build, ESM check, load check and unit suite need NO secrets and touch NO
# database or deployed host. The unit suite builds every service with mocks, and
# src/app.module.di.spec.ts blanks every key it finds in .env (there is none in
# CI) and replaces the TypeORM DataSource with one whose initialize() throws, so
# an attempt to connect fails the spec instead of reaching anything.
#
# The last two steps (RLS verification, cross-tenant isolation over HTTP) are
# CI's only cross-tenant checks. They are restored unchanged from the earlier
# ci.yml and are gated on repository secrets: with the secrets absent (forks,
# secretless clones) they print a ::warning:: and skip; with the secrets present
# a failure fails the job. A green run with those warnings means tenant
# isolation was NOT checked by this run. Read the annotations, do not just read
# the tick. They are also release-checklist items 17 and 18:
# docs/runbooks/first-customer-readiness.md.
#
# This replaces the earlier ci.yml, which triggered on `main` only (so a push to
# a `wave0/**` branch ran nothing), targeted Node 24 (the Vercel runtime, now
# disabled) and ran lint as a non-blocking step. The lint step is dropped, not
# kept: a step that cannot fail is not a gate.
#
# Node comes from .nvmrc (22), which matches NODE_VERSION in render.yaml and the
# Dockerfile base image. 22 because the lockfile's @supabase/* packages declare
# engines node >=22.0.0 and Node 20 passed its upstream end of life on
# 2026-04-30. Change .nvmrc, render.yaml and the Dockerfile together.
#
# NOTHING IN THIS FILE MAY MASK A FAILURE: no step-level error suppression and
# no shell fallbacks that force a zero exit status.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'wave0/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Build, ESM check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No `version:` input. pnpm/action-setup@v4 reads `packageManager` from
      # package.json (pnpm@10.26.2 at time of writing), so the pin lives in one
      # place. It must run before setup-node so `cache: pnpm` can find pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm # caches the pnpm store, keyed on pnpm-lock.yaml

      # --frozen-lockfile fails if pnpm-lock.yaml and package.json disagree.
      # Dev dependencies are required: the build is `nest build`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      # An ESM-only package anywhere in the require graph crashes a CommonJS
      # loader at start-up while passing every local test.
      - name: Check for ESM-only dependencies
        run: npm run check:cjs

      # Proves the compiled entry points load under CommonJS. JWT_SECRET is a
      # synthetic placeholder: loading app.module runs the Joi config
      # validation, which requires it. This checks loadability, not
      # configuration.
      - name: Verify the compiled app loads under CommonJS
        env:
          JWT_SECRET: ci-load-check-not-a-real-secret
        run: node -e "require('./dist/src/app.module'); require('./dist/src/swagger');"

      - name: Test
        run: npm test

      # Attempts real cross-tenant reads/writes as the non-BYPASSRLS app role
      # and fails if any succeed (CLAUDE.md §6.4: never trust "RLS is on"
      # without running this). Runs only when the repo secret is configured —
      # forks and secretless clones skip it rather than red-Xing on a missing
      # credential.
      - name: Verify tenant isolation (RLS)
        env:
          DATABASE_APP_URL: ${{ secrets.RLS_VERIFY_DATABASE_APP_URL }}
        run: |
          if [ -z "$DATABASE_APP_URL" ]; then
            echo "::warning::RLS_VERIFY_DATABASE_APP_URL secret not set — tenant-isolation verification SKIPPED. Set it to a Neon branch app-role URL to enforce this gate."
          else
            npm run rls:verify
          fi

      # The endpoint-level half of tenant isolation, and the ONLY "valid token,
      # wrong tenant" suite in the repo. `rls:verify` above proves the database
      # policies hold; this proves the API layered on top of them does not hand
      # tenant A tenant B's rows by some route that never reaches a policy.
      #
      # It was not wired in here, which is why nothing caught DEF-1 making
      # `CreateTenantDto.token` required: the script's two probe signups started
      # 400ing, it exited at "cannot continue", and the suite stopped running
      # without anything turning red. A tenancy suite that is not in CI is a
      # suite that will rot — it did.
      #
      # Runs against a deployed target, so it needs BOTH a base URL and an
      # operator credential to mint signup invites (DEF-1). Skips with a warning
      # when they are absent — forks and secretless clones must not red-X on a
      # missing credential — but a configured runner that then FAILS is a hard
      # gate, exactly like rls:verify.
      - name: Cross-tenant isolation over HTTP
        env:
          BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SWEEP_EMAIL: ${{ secrets.SMOKE_OPERATOR_EMAIL }}
          SWEEP_PASSWORD: ${{ secrets.SMOKE_OPERATOR_PASSWORD }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$SWEEP_EMAIL" ] || [ -z "$SWEEP_PASSWORD" ]; then
            echo "::warning::SMOKE_BASE_URL / SMOKE_OPERATOR_EMAIL / SMOKE_OPERATOR_PASSWORD not set — cross-tenant HTTP isolation SKIPPED. Set all three to enforce this gate."
          else
            npm run smoke:tenancy
          fi
