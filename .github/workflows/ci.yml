# Gates the things that have actually broken production.
#
# Deliberately narrow. The previous pipeline ran `pnpm install --frozen-lockfile`
# against a pnpm-lock.yaml that .vercelignore documents as stale and out of sync
# with package.json, on Node 18 while the deployment runs Node 24 — so it failed
# at the install step and told us nothing. This runs the checks that gate a real
# deploy (see DEPLOY.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node, or `cache: pnpm` has no
      # store path to resolve and the step fails.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          # Match the deployment. `vercel project inspect` reports Node 24.x;
          # this said 22.x, which is the same class of drift the header comment
          # complains about (the previous pipeline ran 18 against a 24 deploy).
          # CI passing on a runtime production does not use proves less than it
          # appears to.
          node-version: '24.x'
          cache: pnpm

      # `pnpm install --frozen-lockfile`, not `npm ci`.
      #
      # **This is why the pipeline could never have gone green.** There is no
      # `package-lock.json` in this repo — only `pnpm-lock.yaml`, with
      # `packageManager: pnpm@10.26.2` pinned in package.json and Vercel
      # building with pnpm. `npm ci` requires a lockfile it would not find and
      # refuses to fall back, so this step failed before any real check ran.
      #
      # The header comment above says the *previous* pipeline failed at install
      # against a stale pnpm lockfile; the fix at the time swung to npm, which
      # this repo does not use. Both versions failed at the same step for
      # opposite reasons. Dev dependencies are required either way: the build
      # is `nest build`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      # The check that matters most for this deployment. Vercel's serverless
      # loader cannot require() an ES module, unlike local Node, so an ESM-only
      # dependency crashes every request while passing every local test. This
      # has broken production twice (uuid, then otplib v13 via @scure/base).
      - name: Check for ESM-only dependencies
        run: npm run check:cjs

      # Catches an entrypoint that compiles but cannot be loaded as CommonJS —
      # the exact failure mode the serverless bundle hits at cold start.
      # JWT_SECRET is a dummy: loading app.module runs the Joi config
      # validation, which requires it. This step verifies loadability, not
      # configuration — this exact failure red-Xed every push since strict
      # validation landed.
      - name: Verify the compiled app loads under CommonJS
        env:
          JWT_SECRET: ci-load-check-not-a-real-secret
        run: node -e "require('./dist/src/app.module'); require('./dist/src/swagger');"

      # Unit tests are a hard gate. The suite is small but guards the two
      # security-critical seams: default-deny auth (GlobalAuthGuard) and
      # vertical policy resolution (PolicyGuard).
      - name: Test
        run: npm test

      # Attempts real cross-tenant reads/writes as the non-BYPASSRLS app role
      # and fails if any succeed (CLAUDE.md §6.4: never trust "RLS is on"
      # without running this). Runs only when the repo secret is configured —
      # forks and secretless clones skip it rather than red-Xing on a missing
      # credential.
      - name: Verify tenant isolation (RLS)
        env:
          DATABASE_APP_URL: ${{ secrets.RLS_VERIFY_DATABASE_APP_URL }}
        run: |
          if [ -z "$DATABASE_APP_URL" ]; then
            echo "::warning::RLS_VERIFY_DATABASE_APP_URL secret not set — tenant-isolation verification SKIPPED. Set it to a Neon branch app-role URL to enforce this gate."
          else
            npm run rls:verify
          fi

      # The endpoint-level half of tenant isolation, and the ONLY "valid token,
      # wrong tenant" suite in the repo. `rls:verify` above proves the database
      # policies hold; this proves the API layered on top of them does not hand
      # tenant A tenant B's rows by some route that never reaches a policy.
      #
      # It was not wired in here, which is why nothing caught DEF-1 making
      # `CreateTenantDto.token` required: the script's two probe signups started
      # 400ing, it exited at "cannot continue", and the suite stopped running
      # without anything turning red. A tenancy suite that is not in CI is a
      # suite that will rot — it did.
      #
      # Runs against a deployed target, so it needs BOTH a base URL and an
      # operator credential to mint signup invites (DEF-1). Skips with a warning
      # when they are absent — forks and secretless clones must not red-X on a
      # missing credential — but a configured runner that then FAILS is a hard
      # gate, exactly like rls:verify.
      - name: Cross-tenant isolation over HTTP
        env:
          BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SWEEP_EMAIL: ${{ secrets.SMOKE_OPERATOR_EMAIL }}
          SWEEP_PASSWORD: ${{ secrets.SMOKE_OPERATOR_PASSWORD }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$SWEEP_EMAIL" ] || [ -z "$SWEEP_PASSWORD" ]; then
            echo "::warning::SMOKE_BASE_URL / SMOKE_OPERATOR_EMAIL / SMOKE_OPERATOR_PASSWORD not set — cross-tenant HTTP isolation SKIPPED. Set all three to enforce this gate."
          else
            npm run smoke:tenancy
          fi

      # Not a gate yet: the existing code has pre-existing lint findings.
      - name: Lint
        run: npm run lint
        continue-on-error: true
